name: Build sprd_flash_drv Module

on:
  workflow_dispatch:
    inputs:
      module_name:
        description: 'Module name to build'
        required: true
        default: 'sprd_flash_drv'

jobs:
  build-module:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      KBUILD_BUILD_USER: 'Ardhiansyah_Aflahal'
      USE_CCACHE: 1
      CCACHE_EXEC: /usr/bin/ccache

      CLANG_BASE: ${{ github.workspace }}/toolchains/clang-r383902b
      GCC_64_BASE: ${{ github.workspace }}/toolchains/gcc-14.3
      CROSS_COMPILE: "${{ github.workspace }}/toolchains/gcc-14.3/bin/aarch64-none-linux-gnu-"
      CROSS_COMPILE_ARM32: "${{ github.workspace }}/toolchains/gcc-14.3/bin/arm-none-linux-gnueabihf-"

      MODULE_PATH: drivers/kernel_modules/common/camera/flash/flash_drv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc g++ python3 libncurses-dev libssl-dev \
            libelf-dev kmod ccache zlib1g-dev

      - name: Setup Toolchains
        run: |
          mkdir -p toolchains
          # asumsi toolchain sudah ada di repo atau cache
          chmod +x ${{ env.CLANG_BASE }}/bin/* ${{ env.GCC_64_BASE }}/bin/*

      - name: Set PATH and ccache
        run: |
          echo "${{ env.CLANG_BASE }}/bin" >> $GITHUB_PATH
          echo "${{ env.GCC_64_BASE }}/bin" >> $GITHUB_PATH
          ccache -M 5G
          ccache -z

      - name: Build sprd_flash_drv Module
        run: |
          echo "[INFO] Building sprd_flash_drv module..."
          mkdir -p modules_out
          make -C . O=out M=${{ env.MODULE_PATH }} \
            ARCH=${{ env.ARCH }} \
            LLVM=1 \
            CC="ccache clang" \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
            modules
          
          cp ${{ env.MODULE_PATH }}/sprd_flash_drv.ko modules_out/
          echo "[INFO] Module built: modules_out/sprd_flash_drv.ko"

      - name: Upload Module
        uses: actions/upload-artifact@v4
        with:
          name: sprd_flash_drv.ko
          path: modules_out/sprd_flash_drv.ko
          retention-days: 7