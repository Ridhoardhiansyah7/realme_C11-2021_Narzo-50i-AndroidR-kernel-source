name: Build dtbo.img from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP berisi file .dtbo"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl aria2 file

      # =========================================
      # Resolve MediaFire / Direct Link
      # =========================================
      - name: Resolve Download Link
        id: link
        run: |
          URL="${{ github.event.inputs.zip_url }}"

          if echo "$URL" | grep -q "mediafire.com/file"; then
            echo "MediaFire detected..."

            page=$(curl -sL "$URL")

            direct=$(echo "$page" | grep -o 'https://download[^"]*' | head -n1)

            if [ -z "$direct" ]; then
              echo "❌ Failed to resolve MediaFire link"
              exit 1
            fi

            echo "Resolved: $direct"
            echo "direct_url=$direct" >> $GITHUB_OUTPUT
          else
            echo "direct_url=$URL" >> $GITHUB_OUTPUT
          fi

      # =========================================
      # Download ZIP
      # =========================================
      - name: Download ZIP
        run: |
          echo "Downloading: ${{ steps.link.outputs.direct_url }}"
          aria2c -x 16 -s 16 -k 1M "${{ steps.link.outputs.direct_url }}" -o dtbo.zip

      # =========================================
      # Validate file
      # =========================================
      - name: Check file
        run: |
          file dtbo.zip
          ls -lah dtbo.zip

          if file dtbo.zip | grep -qi "html"; then
            echo "❌ File is HTML, download failed"
            exit 1
          fi

      # =========================================
      # Extract ZIP
      # =========================================
      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o dtbo.zip -d extracted

      # =========================================
      # Find DTBO files
      # =========================================
      - name: Find DTBO files
        run: |
          find extracted -type f -name "*.dtbo" | sort > list.txt
          cat list.txt

          if [ ! -s list.txt ]; then
            echo "❌ No dtbo files found!"
            exit 1
          fi

      # =========================================
      # Download mkdtboimg
      # =========================================
      - name: Download mkdtboimg
        run: |
          curl -L "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT" \
          | base64 -d > mkdtboimg.py

          chmod +x mkdtboimg.py

      # =========================================
      # Build dtbo.img
      # =========================================
      - name: Build dtbo.img
        run: |
          python3 mkdtboimg.py create dtbo.img $(cat list.txt)

      # =========================================
      # Upload result
      # =========================================
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: dtbo-image
          path: dtbo.img