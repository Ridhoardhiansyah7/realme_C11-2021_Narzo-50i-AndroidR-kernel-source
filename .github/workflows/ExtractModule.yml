name: Extract Kernel Modules

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find and Copy kernel_modules
        run: |
          mkdir -p output

          if [ -d "driver/input/touchscreen/Himax" ]; then
            cp -r driver/input/touchscreen/Himax output/
          else
            echo "Himax touchscreen folder not found!"
            exit 1
          fi

      - name: Zip result
        run: |
          cd output
            zip -r Himax.zip Himax

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_modules
          path: output/Himax.zip
