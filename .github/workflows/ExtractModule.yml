name: Extract Kernel Modules

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find and Copy kernel_modules
        run: |
          mkdir -p output

          if [ -d "driver/kernel_modules" ]; then
            cp -r driver/kernel_modules output/
          elif [ -d "drivers/kernel_modules" ]; then
            cp -r drivers/kernel_modules output/
          else
            echo "kernel_modules folder not found!"
            exit 1
          fi

      - name: Zip result
        run: |
          cd output
          zip -r kernel_modules.zip kernel_modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_modules
          path: output/kernel_modules.zip