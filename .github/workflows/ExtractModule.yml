name: Extract Kernel Modules

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find and Copy kernel_modules
        run: |
          mkdir -p output

          if [ -d "drivers/misc/hqhardwareinfo" ]; then
            cp -r drivers/misc/hqhardwareinfo output/
          fi
          
          

      - name: Zip result
        run: |
          cd output
            zip -r hqhardwareinfo.zip hqhardwareinfo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hqhardwareinfo
          path: output/*.zip
