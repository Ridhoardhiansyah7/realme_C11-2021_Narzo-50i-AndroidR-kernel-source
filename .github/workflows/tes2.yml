name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel defconfig name (e.g., RMX3235_defconfig)'
        required: true
        default: 'RMX3235_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      KERNEL_ROOT: ${{ github.workspace }}
      OUT_DIR: ${{ github.workspace }}/out
      MODULES_OUT: ${{ github.workspace }}/modules_out
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains
      CLANG_PATH: ${{ github.workspace }}/toolchains/clang-r383902b
      GCC_PATH: ${{ github.workspace }}/toolchains/gcc-14.3

      CC: "ccache clang"
      LD: "ld.lld"
      AR: "llvm-ar"
      NM: "llvm-nm"
      OBJCOPY: "llvm-objcopy"
      OBJDUMP: "llvm-objdump"
      STRIP: "llvm-strip"
      LLVM: 1
      LLVM_IAS: 1
      CROSS_COMPILE: ${{ github.workspace }}/toolchains/gcc-14.3/bin/aarch64-none-linux-gnu-
      CROSS_COMPILE_ARM32: ${{ github.workspace }}/toolchains/gcc-14.3/bin/arm-none-linux-gnueabihf-
      CLANG_TRIPLE: "aarch64-none-linux-gnu-"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex git \
            libssl-dev lzop python3 zip unzip libncurses-dev \
            device-tree-compiler ccache lld xz-utils zstd kmod pahole

      - name: Create build directories
        run: |
          mkdir -p ${{ env.OUT_DIR }} ${{ env.MODULES_OUT }} ${{ env.TOOLCHAIN_DIR }}

      - name: Download and setup Clang
        if: ${{ !hashFiles(env.CLANG_PATH + '/bin/clang') }}
        run: |
          mkdir -p ${{ env.CLANG_PATH }}
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz -O /tmp/clang.tar.gz
          tar -xf /tmp/clang.tar.gz -C ${{ env.CLANG_PATH }} --strip-components=1
          rm /tmp/clang.tar.gz
          chmod +x ${{ env.CLANG_PATH }}/bin/*

      - name: Download and setup GCC 14.3
        if: ${{ !hashFiles(env.GCC_PATH + '/bin/aarch64-none-linux-gnu-gcc') }}
        run: |
          mkdir -p ${{ env.GCC_PATH }}
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O /tmp/gcc.tar.xz
          tar -xf /tmp/gcc.tar.xz -C ${{ env.GCC_PATH }} --strip-components=1
          rm /tmp/gcc.tar.xz
          chmod +x ${{ env.GCC_PATH }}/bin/*

      - name: Setup PATH and ccache
        run: |
          echo "${{ env.CLANG_PATH }}/bin" >> $GITHUB_PATH
          echo "${{ env.GCC_PATH }}/bin" >> $GITHUB_PATH
          ccache -M 5G
          ccache -z

      - name: Build Kernel, Modules, and DTBs
        run: |
          echo "[INFO] Starting kernel build..."
          export KBUILD_BUILD_USER="github-actions"
          export KBUILD_BUILD_HOST="github-actions"

          # Defconfig
          make -C ${{ env.KERNEL_ROOT }} O=${{ env.OUT_DIR }} ARCH=$ARCH ${{ inputs.defconfig }} || exit 1

          # Build
          make -C ${{ env.KERNEL_ROOT }} \
            O=${{ env.OUT_DIR }} \
            -j$(nproc) \
            LLVM=1 LLVM_IAS=1 ARCH=$ARCH \
            CC="$CC" LD="$LD" AR="$AR" NM="$NM" \
            OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            Image modules dtbs || exit 1

      - name: Package DTB and DTBO files
        run: |
          mkdir -p ${{ github.workspace }}/build/dtb
          DTB_SRC="${{ env.OUT_DIR }}/arch/arm64/boot/dts/sprd"
          DTB_DST="${{ github.workspace }}/build/dtb"
          if [ -d "$DTB_SRC" ]; then
            cp $DTB_SRC/*.dtb $DTB_DST/ || true
            cp $DTB_SRC/*.dtbo $DTB_DST/ || true
          fi

      - name: Package Kernel and Modules
        run: |
          mkdir -p ${{ github.workspace }}/build
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image ${{ github.workspace }}/build/
          cd ${{ env.MODULES_OUT }}
          zip -r9 ${{ github.workspace }}/build/modules-${{ github.run_id }}.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ github.run_id }}
          path: ${{ github.workspace }}/build/*
          retention-days: 7